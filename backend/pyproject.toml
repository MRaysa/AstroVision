[project]
name = "astrovision-backend"
version = "0.1.0"
description = "FastAPI backend for AstroVision — FITS loading, analysis and processing."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injection idioms (File(...), Depends(...)) in argument defaults.
"app/api/**" = ["B008"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
